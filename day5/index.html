<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - User Directory</title>
  <script src="users.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    header,
    .controls,
    #users-list li {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    button {
      width: 100%;
      padding: 11px;
      font: inherit;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    button {
      background-color: #145da0;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      min-height: 1.5em;
      margin: 0;
    }

    #users-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #users-list li h2 {
      margin-top: 0;
      font-size: 1.2rem;
    }

    #users-list li p {
      margin: 6px 0;
      overflow-wrap: anywhere;
    }

    @media (max-width: 500px) {
      body {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>User Directory</h1>
      <p>Load users from an API and filter them by name.</p>
    </header>

    <section class="controls" aria-label="User controls">
      <button id="load-users" type="button">
        Load Users
      </button>

      <div>
        <label for="filter-input">Filter users by name</label>
        <input
          id="filter-input"
          type="text"
          placeholder="Type a name..."
          autocomplete="off"
        >
      </div>

      <p id="status" role="status" aria-live="polite">
        Select "Load Users" to get started.
      </p>
    </section>

    <section aria-label="Users">
      <ul id="users-list"></ul>
    </section>
  </main>
</body>
</html>
